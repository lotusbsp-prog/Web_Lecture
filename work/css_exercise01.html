<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY PROFILE</title>

    <style>
        body {
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 700px;
            margin: 30px auto;
            background-color: white;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 30px;
        }

        header h1 {
            margin: 0;
        }

        .profile {
            margin: 30px;
            padding: 20px;
            background-color: lightblue;
            border-radius: 10px;
        }

        .profile h2 {
            margin-top: 0;
        }

        section {
            margin: 30px;
            padding: 20px;
            border: 1px solid #cccccc;
            border-radius: 8px;
        }

        section h2 {
            color: navy;
            border-bottom: 2px solid navy;
            padding-bottom: 10px;
        }

        .skills span {
            display: inline-block;
            padding: 8px 15px;
            margin-right: 10px;
            border-radius: 15px;
        }

        .html {
            background-color: lightgreen;
        }

        .css {
            background-color: lightpink;
        }

        .javascript {
            background-color: lightgray;
        }

        .git {
            background-color: pink;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>MY PROFILE</h1>
        <p>Web Programming Practice</p>
    </header>

    <div class="profile">
        <h2>김민찬</h2>
        <p>전공: 컴퓨터소프트웨어학과</p>
        <p>관심분야: Web / AI / 게임개발</p>
    </div>

    <section>
        <h2>관심 기술</h2>

        <div class="skills">
            <span class="html">HTML</span>
            <span class="css">CSS</span>
            <span class="javascript">JavaScript</span>
            <span class="git">Git</span>
        </div>
    </section>

    <section>
        <h2>자기소개</h2>

        <p>
            웹 프로그래밍을 공부하고 있습니다.
            HTML과 CSS를 사용하여 웹페이지의 구조와 디자인을 구현하는 방법을 학습하고 있습니다.
        </p>
    </section>

    <section>
        <h2>문의하기</h2>

        <p>
            <label>이름</label>
            <input type="text" placeholder="이름을 입력하세요">
        </p>

        <p>
            <label>이메일</label>
            <input type="email" placeholder="이메일을 입력하세요">
        </p>

        <button>문의하기</button>
    </section>

    <footer>
        2026 Web Programming Practice
    </footer>

</div>

</body>
</html>
