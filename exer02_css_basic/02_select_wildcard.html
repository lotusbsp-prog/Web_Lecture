<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            color: red;
        }

        div {
            width: 1000px;
            height: 300px;
            background-color: yellow;

            border: 20px solid black;

            margin-left: 10px;
            margin-right: 10px;
            margin-top: 10px;
            margin-bottom: 10px;

            padding-left: 40px;
            padding-right: 40px;
            padding-top: 40px;
            padding-bottom: 40px;
        }
    </style>
</head>

<body>
    <div>
        <h1>제목 글자</h1>

        <p>
            우아한 프라다 
            우아한 샤넬 
            깔끔한 마르지엘라 
            같은 너에 반해 
            잘하려 했지
            허나 자격지심때문에
            너를 못 가져
            너를 못 안어
            그댄 변함 없이 아주 너무나도 아름다워
        </p>
    </div>
</body>
</html>
